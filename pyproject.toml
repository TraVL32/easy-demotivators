[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "demotivator"
version = "0.1.0"
description = "Tiny Pillow-based demotivator poster generator"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["pillow>=10.0"]
keywords = ["demotivator", "meme", "pillow", "telegram"]

[project.scripts]
demotivator = "demotivator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
demotivator = ["py.typed"]
